name: "Build Windows EXE"

on:
  workflow_dispatch:          # manual trigger
  push:
    tags:
      - "v*"                  # auto-build on version tags

jobs:
  build-exe:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install --no-deps python-jobspy
          pip install pydantic tls-client requests markdownify regex
          pip install pyinstaller

      - name: Build EXE
        run: pyinstaller applypilot.spec

      - name: Create ZIP package
        run: |
          Compress-Archive -Path dist\ApplyPilot.exe, install.ps1, README.md -DestinationPath ApplyPilot-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApplyPilot-Windows
          path: ApplyPilot-Windows.zip

      - name: Upload to Release (if tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ApplyPilot-Windows.zip
